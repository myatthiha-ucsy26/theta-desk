[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-desk"
version = "0.1.0"
description = "Credit-spread scanning and execution desk for US equity options"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "flask==3.1.3",
    "pandas==3.0.5",
    "futu-api==10.10.7008",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
mcp = ["mcp>=2.2"]

[tool.setuptools.packages.find]
include = ["theta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
